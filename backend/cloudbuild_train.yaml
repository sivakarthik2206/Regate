steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/regate-506903/regate-repo/regate-trainer:latest'
      - '-f'
      - 'Dockerfile.train'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/regate-506903/regate-repo/regate-trainer:latest'
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 50
timeout: '1800s'
